<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物的運輸｜我的學習總表</title><link rel="stylesheet" href="course.css"><script src="course-config.js"></script><script src="course.js"></script></head>
<body class="pt-page"><main class="pt-main"><div class="pt-kicker">植物的運輸探索之旅 · 10</div><h1>我的學習總表</h1><p id="summary-student"></p><p id="completion-note" role="status"></p><section class="pt-panel"><h2>學習歷程總分</h2><div id="learning-total" class="pt-score">0／57 分</div><p id="learning-total-note"></p></section><section class="pt-panel"><h2>活動與成績</h2><div class="pt-table-wrap"><table class="pt-table"><thead><tr><th scope="col">學習活動</th><th scope="col">雲端紀錄</th><th scope="col">最近成績</th><th scope="col">最高成績</th><th scope="col">完成次數</th></tr></thead><tbody id="summary-rows"></tbody></table></div><p class="pt-hint">第 1、2、3、5、6 頁依答對次數計分。討論與探究回答由老師評閱，只標示提交狀態。挑戰賽與滿分 100 分的總評量另列，不與 57 分的學習歷程混加。</p></section>
<section class="pt-panel"><h2>完成學習</h2><p id="summary-status" role="status" aria-live="polite"></p><button id="sync-summary" class="pt-button" type="button">重試同步學習總表</button><p class="pt-hint">所有活動完成後，總表會自動同步。此頁只顯示目前學生在本瀏覽器的學習紀錄，更換裝置不會自動帶入資料。</p></section><div class="pt-actions"><a href="9.html" class="pt-button">← 回到總評量</a><button class="pt-button" id="print-summary" type="button">列印我的總表</button><a href="index.html" class="pt-button">回到首頁</a></div></main><script src="summary.js"></script></body></html>
