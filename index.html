<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物的運輸探索之旅</title><link rel="stylesheet" href="course.css"><script src="course-config.js"></script><script src="course.js"></script></head><body class="pt-page"><main class="pt-main"><div class="pt-kicker">從根到葉，連起一株植物的生活</div><h1>植物的運輸探索之旅</h1><p>認識運輸構造、挑戰遊戲、完成蒸散探究，最後用總評量整理所學。</p><section class="pt-panel"><h2>先認識你</h2><p>基本資料只需填寫一次，後續活動會自動帶入。共用電腦請確認顯示的是自己的資料。</p><form id="student-form"><div class="pt-fields"><label>班級<input name="class" required maxlength="40" placeholder="例如：701" autocomplete="off"></label><label>座號<input name="seat" required inputmode="numeric" pattern="0?[1-9]|[12][0-9]|30" maxlength="2" placeholder="1～30" title="請輸入 1～30 的整數座號" autocomplete="off"></label><label>姓名<input name="name" required maxlength="50" placeholder="請填寫姓名" autocomplete="off"></label></div><p id="profile-message" role="status" aria-live="polite"></p><button class="pt-button primary" type="submit">儲存資料並開始 →</button></form></section><section class="pt-panel"><h2>這次的學習路線</h2><p>維管束與年輪 → 水分與養分運輸 → 運輸挑戰賽 → 蒸散探究 → 20 題總評量 → 我的學習總表。</p><p class="pt-hint">活動答案與分數會傳至老師的試算表。本瀏覽器會暫存未送出的資料，確認上傳後才能前往下一頁。</p><a class="pt-button" href="10.html">查看目前學習紀錄</a></section></main><script>
const form=document.getElementById('student-form');
const prior=PT.profile();if(prior)for(const key of ['class','seat','name'])form.elements[key].value=prior[key];
form.addEventListener('submit',event=>{event.preventDefault();try{if(!PT.startProfile({class:form.elements.class.value,seat:form.elements.seat.value,name:form.elements.name.value}))return;const requested=new URLSearchParams(location.search).get('return');location.href=/^(?:[1-9]|10)\.html$/.test(requested||'')?requested:'1.html';}catch(err){document.getElementById('profile-message').textContent=err.message;}});
</script></body></html>
